name: Verify web and Godot
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: python tools/build_site.py --web-only
  godot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.5.1'
          use-dotnet: false
          include-templates: false
      - name: Verify real gameplay and animated feedback
        run: python tools/check_godot.py --godot godot
      - uses: actions/cache@v4
        with:
          path: /tmp/opencode/godot-web-4.5.1
          key: godot-web-nothreads-4.5.1-v1
      - name: Verify WebGL export and complete site
        run: |
          python tools/export_godot_web.py --godot godot
          python tools/build_site.py
      - name: Verify real WebGL gameplay in Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python tools/check_webgl.py
      - name: Verify networked Godot host and two phones
        run: python tools/check_network_godot.py
      - uses: actions/upload-artifact@v4
        with:
          name: physogezic-browser-site
          path: dist/site
      - name: Source project for opening in Godot
        uses: actions/upload-artifact@v4
        with:
          name: physogezic-godot-project
          path: Godot3D
          include-hidden-files: false
